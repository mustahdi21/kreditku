# =============================================================================
# KreditKu — konfigurasi Supabase CLI untuk pengembangan lokal
# Jalankan: supabase start && supabase db reset
# =============================================================================

project_id = "kreditku"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "application/pdf"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:4173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.github]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.invite-user]
verify_jwt = true

[functions.qris-confirm]
verify_jwt = false

# Calon pelanggan belum punya akun saat mendaftar, sehingga permintaannya tidak
# membawa sesi. Penjaganya adalah kode undangan yang hanya dapat dibuat admin.
[functions.customer-signup]
verify_jwt = false

[functions.reminder-dispatch]
verify_jwt = false

[functions.dashboard-metrics]
verify_jwt = true
